name: MTender daily digest
on:
  schedule:
    - cron: "40 4 * * *"   # 04:40 UTC = 07:40 Chișinău (vara)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Zile în urmă de scanat"
        default: "2"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run monitor
        run: python3 mtender_watch.py --lookback-days "${{ github.event.inputs.lookback_days || 2 }}"
      - name: Commit digest + state
        run: |
          git config user.name "mtender-watch"
          git config user.email "actions@users.noreply.github.com"
          git add output/ data/
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push
